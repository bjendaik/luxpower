<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxPower SNA - Multi-Device Cloud Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0b1120; --card: #151f32; --border: #263554; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #38bdf8; --solar: #f59e0b; --bat: #10b981; --grid: #a855f7; --load: #3b82f6; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 60px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 800; color: #fff; }
    .brand span.hl { color: var(--solar); }
    
    /* Ô CHỌN THIẾT BỊ ĐA TRẠM */
    .device-select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0b1120;
      border: 1px solid var(--accent);
      padding: 2px 8px;
      border-radius: 8px;
    }
    .device-select {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }
    .device-select option { background: #0f172a; color: #fff; }

    .status-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1e293b;
      border: 1px solid var(--border);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.2s; }
    .dot.ok { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .dot.err { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

    @keyframes flashDotAnim {
      0% { background: #34d399; box-shadow: 0 0 16px 4px #34d399; transform: scale(1.6); }
      50% { background: #a7f3d0; box-shadow: 0 0 22px 6px #34d399; transform: scale(1.8); }
      100% { background: #10b981; box-shadow: 0 0 6px #10b981; transform: scale(1); }
    }
    .dot.flash { animation: flashDotAnim 0.5s ease-out; }

    .sb-tgl {
      display: none; background: #1e293b; border: 1px solid var(--border);
      color: var(--text); font-size: 1.15rem; width: 38px; height: 38px; border-radius: 10px;
      cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0;
    }
    @media (min-width: 901px) { .sb-tgl.d { display: inline-flex; } }
    @media (max-width: 900px) { .sb-tgl.m { display: inline-flex; } }

    .layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar {
      width: 240px; flex-shrink: 0; background: #0f172a; border-right: 1px solid var(--border);
      padding: 16px 12px; position: sticky; top: 60px; height: calc(100vh - 60px);
      overflow-y: auto; transition: width 0.25s, transform 0.25s;
    }
    .sidebar.collapsed { width: 64px; padding: 16px 8px; }
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .sidebar-title,
    .sidebar.collapsed .sidebar-footer { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 12px 0; }
    .sidebar-title {
      font-size: 0.68rem; text-transform: uppercase; color: var(--muted);
      font-weight: 700; letter-spacing: 0.6px; padding: 0 8px 6px;
      border-bottom: 1px solid var(--border); margin-bottom: 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 4px;
      border-radius: 10px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 0.9rem;
      transition: all 0.15s; border: 1px solid transparent; white-space: nowrap; overflow: hidden;
    }
    .nav-item:hover { background: #1e293b; color: var(--text); }
    .nav-item.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 700; }
    .nav-icon { font-size: 1.1rem; flex-shrink: 0; width: 22px; text-align: center; }
    .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-footer {
      margin-top: 16px; padding: 10px 8px; font-size: 0.72rem; color: var(--muted);
      border-top: 1px solid var(--border); line-height: 1.6;
    }
    .main { flex: 1; min-width: 0; padding: 18px; }
    .sb-ov { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 150; }
    .sb-ov.open { display: block; }
    @media (max-width: 900px) {
      .sidebar {
        position: fixed; top: 0; left: 0; height: 100vh; z-index: 200;
        transform: translateX(-100%); width: 260px; box-shadow: 4px 0 20px rgba(0,0,0,0.5); padding: 16px 12px;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar.collapsed { width: 260px; padding: 16px 12px; }
      .sidebar.collapsed .nav-label, .sidebar.collapsed .sidebar-title, .sidebar.collapsed .sidebar-footer { display: block; }
      .sidebar.collapsed .nav-item { justify-content: flex-start; padding: 12px 14px; }
      .main { padding: 12px; }
    }

    .power-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 16px; }
    @media (min-width: 1100px) { .power-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 600px) { .power-grid { grid-template-columns: 1fr; } }
    .power-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 16px; position: relative; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .power-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 5px; }
    .power-card.pv::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .power-card.bat::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .power-card.grid::before { background: linear-gradient(90deg, #a855f7, #c084fc); }
    .power-card.load::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .pc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 6px; }
    .pc-title { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .pc-icon { font-size: 1.3rem; }
    .pc-tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: var(--muted); }
    .pc-value { font-size: 2.1rem; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 4px; }
    .pc-value small { font-size: 0.95rem; font-weight: 600; color: var(--muted); }
    .pc-sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; line-height: 1.45; }
    .pc-sub strong { color: var(--text); }
    .pc-rows { border-top: 1px dashed rgba(255, 255, 255, 0.08); padding-top: 8px; }
    .pc-row { display: flex; justify-content: space-between; font-size: 0.79rem; padding: 3.5px 0; gap: 8px; }
    .pc-row span:first-child { color: var(--muted); }
    .pc-row span:last-child { font-weight: 600; color: #f8fafc; text-align: right; }
    .soc-bar { height: 10px; background: #0f172a; border-radius: 999px; overflow: hidden; margin: 8px 0 10px; border: 1px solid var(--border); }
    .soc-fill { height: 100%; background: linear-gradient(90deg, #059669, #34d399); transition: width 0.4s; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .stat-label { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.4px; margin-bottom: 6px; }
    .stat-val { font-size: 1.35rem; font-weight: 800; color: #fff; }
    .stat-val small { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .stat-box.pv .stat-val { color: var(--solar); }
    .stat-box.bat .stat-val { color: var(--bat); }
    .stat-box.grid .stat-val { color: var(--grid); }
    .stat-box.load .stat-val { color: var(--load); }

    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .chart-title { font-size: 0.9rem; font-weight: 700; }
    .chart-wrap { position: relative; width: 100%; height: 260px; }
    .chart-svg { width: 100%; height: 100%; display: block; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); position: relative; overflow: hidden; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .card-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    .form-group input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #0b1120; color: #fff; font-size: 0.92rem; outline: none;
    }
    .form-group input:focus { border-color: var(--accent); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 14px; }
    .btn-row { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }

    .reg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
    .reg-item {
      background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.82rem;
      cursor: pointer; user-select: none; transition: all 0.15s;
    }
    .reg-item:hover { background: #16233b; }
    .reg-item.on { border-color: #10b981; background: rgba(16, 185, 129, 0.08); }
    .reg-item.tele { border-left: 3px solid #38bdf8; }
    .reg-idx { color: var(--muted); font-weight: 600; font-size: 0.7rem; }
    .reg-name { color: #cbd5e1; font-weight: 600; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reg-val { color: var(--accent); font-family: monospace; font-weight: 700; }
    .reg-toggle {
      width: 32px; height: 18px; background: #334155; border-radius: 999px;
      position: relative; flex-shrink: 0; transition: background 0.2s;
    }
    .reg-toggle::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      background: #94a3b8; border-radius: 50%; transition: all 0.2s;
    }
    .reg-item.on .reg-toggle { background: #10b981; }
    .
